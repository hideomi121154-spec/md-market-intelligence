name: JADA official page discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/discover_jada.py'
      - '.github/workflows/jada-discovery.yml'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/discover_jada.py
      - run: |
          git add data/jada_discovery.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: inspect official JADA link layout" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
