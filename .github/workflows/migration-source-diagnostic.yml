name: Inspect official migration Excel structure (temporary)
on:
  push:
    branches: [feature/jobs-population-migration-20261102]
    paths: ['.github/workflows/migration-source-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect government source's first rows
        run: |
          python - <<'PY'
          import urllib.request,zipfile,io,re,xml.etree.ElementTree as E
          url='https://www.stat.go.jp/data/idou/sokuhou/tsuki/zuhyou/hyo02.xlsx'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=25) as resp:
              data=resp.read()
          print('Workbook length',len(data))
          z=zipfile.ZipFile(io.BytesIO(data))
          N='{http://schemas.openxmlformats.org/spreadsheetml/2006/main}'
          ss=[]
          if 'xl/sharedStrings.xml' in z.namelist():
              for si in E.fromstring(z.read('xl/sharedStrings.xml')).findall(N+'si'):
                  ss.append(''.join((t.text or '') for t in si.iter(N+'t')))
          print('Sheets',[(s.get('name'),s.get('sheetId')) for s in E.fromstring(z.read('xl/workbook.xml')).findall('.//'+N+'sheet')])
          for fn in [x for x in z.namelist() if re.fullmatch(r'xl/worksheets/sheet\d+\.xml',x)][:2]:
              print('SHEET',fn)
              root=E.fromstring(z.read(fn))
              for row in root.findall('.//'+N+'sheetData/'+N+'row')[:100]:
                  vs=[]
                  for c in row.findall(N+'c'):
                      v=c.find(N+'v'); ins=c.find(N+'is')
                      s=v.text if v is not None else ''.join((x.text or '') for x in ins.iter(N+'t')) if ins is not None else ''
                      if c.get('t')=='s' and s:s=ss[int(s)]
                      if s and len(vs)<24:vs.append(c.get('r')+':'+str(s)[:44])
                  if vs:print('ROW',row.get('r'),' | '.join(vs))
          PY
