name: Demand signal ranking validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'demand-signals.js'
      - 'listing-counts.js'
      - 'listing-counts.css'
      - 'demand-signals.css'
      - 'data/demand_rankings.json'
      - 'tests/test_demand_signals.js'
      - 'tests/test_listing_counts.js'
      - 'index.html'
      - '.github/workflows/demand-signals-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JS syntax
        run: node --check demand-signals.js && node --check listing-counts.js
      - name: Validate demand ranking and model listing-count notebook
        run: node tests/test_demand_signals.js && node tests/test_listing_counts.js
      - name: Verify demand screen controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          html=Path('index.html').read_text(encoding='utf-8')
          ids=[
            'demand-signals-panel','demand-refresh','demand-period','demand-overlap',
            'demand-covered','demand-source-carsensor','demand-source-goonet',
            'demand-month','demand-common-only','demand-status','demand-list',
            'demand-entry-month','demand-entry-platform','demand-entry-rank',
            'demand-entry-make','demand-entry-model','demand-add','demand-manual-status'
          ]
          missing=[i for i in ids if f'id="{i}"' not in html]
          assert not missing, f'Missing UI controls: {missing}'
          assert 'demand-signals.js?v=2.0.5' in html
          assert 'demand-signals.css?v=1.7.1' in html
          data=json.loads(Path('data/demand_rankings.json').read_text(encoding='utf-8'))
          assert data['snapshots'][0]['month']==data['snapshots'][1]['month']=='2026-09'
          assert all(len(x['models'])==10 for x in data['snapshots'])
          assert all([r['rank'] for r in x['models']]==list(range(1,11)) for x in data['snapshots'])
          for name in ('demand-top10-carsensor','demand-top10-goonet'):
            assert f'id="{name}"' in html
          print('Demand UI and same-period source data verified')
          PY
