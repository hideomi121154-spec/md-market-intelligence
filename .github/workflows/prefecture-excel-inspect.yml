name: Verify latest official e-Stat table 12 workbook
on:
  pull_request:
    paths: ['.github/workflows/prefecture-excel-inspect.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python - <<'PY'
          import urllib.request,urllib.error,urllib.parse,html,re,io,zipfile
          from http.cookiejar import CookieJar
          root='https://www.e-stat.go.jp'
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(CookieJar()))
          ua={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
          index=root+'/stat-search/files?cycle=1&layout=dataset&page=1&toukei=00450222&tstat=000001020327'
          try:
           h=op.open(urllib.request.Request(index,headers=ua),timeout=15).read().decode('utf-8')
           for q in ['000040518992','000040518991','000040519000']:
            i=h.index(q) if q in h else -1
            print('ID',q,'CONTEXT',re.sub(r'\s+',' ',html.unescape(h[max(0,i-150):i+1300]))[:1200])
          except Exception as ex:print('INDEX_ERROR',str(ex)[:200])
          for ident in ['000040518992','000040505323']:
           for suffix in [f'/stat-search/file-download?statInfId={ident}&fileKind=0',f'/stat-search/file-download?statInfId={ident}&fileKind=0&download=1']:
            try:
             r=op.open(urllib.request.Request(root+suffix,headers={**ua,'Referer':index}),timeout=15)
             b=r.read(6500000)
             print('FETCH',ident,r.status,r.url,r.headers.get('Content-Type'),len(b),b[:20],zipfile.is_zipfile(io.BytesIO(b)))
             if zipfile.is_zipfile(io.BytesIO(b)):
              z=zipfile.ZipFile(io.BytesIO(b))
              print('CONTENTS',z.namelist()[:12])
            except Exception as e:print('ERROR',ident,type(e).__name__,str(e)[:140])
          PY
