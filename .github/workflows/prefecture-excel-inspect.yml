name: Inspect e-Stat official labor workbook download links
on:
  pull_request:
    paths: ['.github/workflows/prefecture-excel-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python - <<'PY'
          import urllib.request,re,html
          urls=[
           'https://www.e-stat.go.jp/stat-search/files?layout=dataset&stat_infid=000040505323&toukei_kind=8',
           'https://www.e-stat.go.jp/stat-search/files?cycle=1&layout=dataset&page=1&toukei=00450222&tstat=000001020327',
          ]
          for url in urls:
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            s=urllib.request.urlopen(req,timeout=18).read().decode('utf-8','replace')
            print('PAGE',url,'length',len(s),'contains statinfo',s.count('stat_infid'))
            for q in ['file-download','file_download','fileKind','statInfId','000040505323','長期時系列表 12','2026年9月']:
             for m in list(re.finditer(re.escape(q),s,re.I))[:3]:
              print('HIT',q,html.unescape(re.sub(r'\s+',' ',s[max(m.start()-180,0):m.end()+260]))[:440])
            print('candidate hrefs')
            for href in re.findall(r'(?:href|data-href)=[\x22\x27]([^\x22\x27]+)',s)[:1800]:
             if 'download' in href.lower() or 'stat_infid' in href.lower():
              print('HREF',html.unescape(href)[:300])
           except Exception as exc:print('ERROR',str(exc)[:180])
          PY
