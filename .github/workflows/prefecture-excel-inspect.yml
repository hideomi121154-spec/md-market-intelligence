name: Inspect official Table 12 Excel layout
on:
  pull_request:
    paths: ['.github/workflows/prefecture-excel-inspect.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python - <<'PY'
          import urllib.request,zipfile,io,xml.etree.ElementTree as ET,re
          root='https://www.e-stat.go.jp'
          u=root+'/stat-search/files?cycle=1&layout=dataset&page=1&toukei=00450222&tstat=000001020327'
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(__import__('http.cookiejar',fromlist=['CookieJar']).CookieJar()))
          req=lambda u,ref=None:urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0',**({'Referer':ref} if ref else {})})
          op.open(req(u),timeout=15).read()
          b=op.open(req(root+'/stat-search/file-download?statInfId=000040518992&fileKind=0',u),timeout=15).read()
          z=zipfile.ZipFile(io.BytesIO(b))
          n={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          shared=[]
          if 'xl/sharedStrings.xml' in z.namelist():
           ss=ET.fromstring(z.read('xl/sharedStrings.xml'))
           shared=[''.join(x.itertext()) for x in ss.findall('m:si',n)]
          print('SHARED',len(shared))
          workbook=ET.fromstring(z.read('xl/workbook.xml'))
          print('SHEETS',[(x.get('name'),x.get('sheetId')) for x in workbook.findall('m:sheets/m:sheet',n)])
          for sheet in [p for p in z.namelist() if re.fullmatch(r'xl/worksheets/sheet\d+\.xml',p)]:
           xml=ET.fromstring(z.read(sheet))
           rows=xml.findall('m:sheetData/m:row',n)
           print('SHEET',sheet,'rowcount',len(rows))
           for row in rows[:14]+rows[-5:]:
            cells=[]
            for c in row.findall('m:c',n):
             v=c.find('m:v',n);inline=c.find('m:is',n)
             t=v.text if v is not None else ''.join(inline.itertext()) if inline is not None else ''
             if c.get('t')=='s' and t is not None:t=shared[int(t)]
             if str(t).strip():cells.append((c.get('r'),str(t)[:45]))
            print('ROW',row.get('r'),cells[:16])
          PY
