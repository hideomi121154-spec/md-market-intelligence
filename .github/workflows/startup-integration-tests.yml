name: Startup and offline integration tests
on:
  push:
    paths:
      - 'storage.js'
      - 'offline-data.js'
      - 'uss.js'
      - 'model-sales.js'
      - 'registered-sales.js'
      - 'demand-signals.js'
      - 'kei-history.js'
      - 'registered-history.js'
      - 'tests/test_offline_data.cjs'
      - 'app.js'
      - 'sw.js'
      - 'index.html'
      - 'inventory-observations.js'
      - 'inventory-observations.css'
      - 'tests/test_startup_diagnostics.js'
      - '.github/workflows/startup-integration-tests.yml'
  pull_request:
    paths:
      - 'storage.js'
      - 'app.js'
      - 'sw.js'
      - 'index.html'
      - 'inventory-observations.js'
      - 'inventory-observations.css'
      - 'tests/test_startup_diagnostics.js'
      - '.github/workflows/startup-integration-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check storage.js && node --check app.js && node --check sw.js && node --check inventory-observations.js && node --check offline-data.js && node --check tests/test_offline_data.cjs
      - run: node tests/test_startup_diagnostics.js
      - run: node tests/test_inventory_observations.js
      - run: node tests/test_offline_data.cjs
