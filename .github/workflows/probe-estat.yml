name: Probe e-Stat workbook schema
on:
  push:
    paths: ['scripts/probe_estat_workbook.py', '.github/workflows/probe-estat.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests openpyxl
      - run: python scripts/probe_estat_workbook.py
