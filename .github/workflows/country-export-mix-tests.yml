name: Country export mix and HS import validation
on:
  push:
    paths:
      - 'country-export-mix.*'
      - 'data/overseas-export-snapshot.json'
      - 'index.html'
      - 'sw.js'
      - 'tests/test_country_export_mix.cjs'
      - '.github/workflows/country-export-mix-tests.yml'
  pull_request:
    paths:
      - 'country-export-mix.*'
      - 'data/overseas-export-snapshot.json'
      - 'index.html'
      - 'sw.js'
      - 'tests/test_country_export_mix.cjs'
      - '.github/workflows/country-export-mix-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check country-export-mix.js && node --check sw.js
      - run: node tests/test_country_export_mix.cjs
      - run: node tests/test_overseas_market.cjs
      - run: node tests/test_russia_yaris.cjs
