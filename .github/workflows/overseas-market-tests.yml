name: Overseas market demand intelligence regression
on:
  pull_request:
    paths:
      - 'overseas-market.js'
      - 'overseas-market.css'
      - 'data/overseas-export-snapshot.json'
      - 'index.html'
      - 'sw.js'
      - 'tests/test_overseas_market.cjs'
      - '.github/workflows/overseas-market-tests.yml'
  push:
    paths:
      - 'overseas-market.js'
      - 'overseas-market.css'
      - 'data/overseas-export-snapshot.json'
      - 'index.html'
      - 'sw.js'
      - 'tests/test_overseas_market.cjs'
      - '.github/workflows/overseas-market-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check overseas-market.js && node --check tests/test_overseas_market.cjs
      - name: Calculations, transparency, data integrity and PWA links
        run: node tests/test_overseas_market.cjs
