name: USS official monthly source check
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official USS source and verify
        run: python scripts/fetch_uss_monthly.py
      - name: Commit verified metadata only
        run: |
          if git diff --quiet -- data/uss_source_status.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uss_source_status.json
          git commit -m "data: check official USS monthly source"
          git push
