name: Inspect historical JADA PDF layout
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/inspect_annual_jada.py'
      - '.github/workflows/inspect-annual-jada.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pymupdf==1.26.5
      - run: python scripts/inspect_annual_jada.py
      - name: Save source diagnostics
        run: |
          git add data/annual_pdf_layout_diag.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: inspect JADA historical PDF layouts" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
