name: Official kei model sales monthly update
on:
  workflow_dispatch:
  schedule:
    - cron: '38 1 * * *'
  push:
    paths:
      - 'scripts/fetch_model_sales.py'
      - 'tests/test_model_sales.py'
      - '.github/workflows/model-sales.yml'
permissions:
  contents: write
concurrency:
  group: official-kei-model-sales
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify model-sales parser
        run: python -m unittest discover -s tests -v
      - name: Fetch official latest passenger nameplate ranking
        run: python scripts/fetch_model_sales.py
      - name: Commit official published data only
        run: |
          git add data/model_sales.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update official kei new-car model sales"
          git pull --rebase origin main
          git push origin HEAD:main
