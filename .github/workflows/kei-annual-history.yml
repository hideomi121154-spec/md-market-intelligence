name: Official historical kei NEW car annual series
on:
  workflow_dispatch:
  schedule:
    - cron: '16 2 10 1 *'
  push:
    paths:
      - 'scripts/fetch_kei_history.py'
      - 'tests/test_kei_history.py'
      - '.github/workflows/kei-annual-history.yml'
permissions:
  contents: write
concurrency:
  group: kei-annual-history
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test historical sales parser
        run: python -m unittest discover -s tests -p 'test_kei_history.py' -v
      - name: Collect and check published calendar-year official reports
        run: |
          python scripts/fetch_kei_history.py > /tmp/kei_history_test.log 2>&1 || true
          cat /tmp/kei_history_test.log
          mkdir -p data
          cp /tmp/kei_history_test.log data/kei_history_diagnostics.txt
      - name: Commit verified public annual figures
        run: |
          git add -f data/kei_history_diagnostics.txt
          if [ -f data/kei_annual_history.json ]; then git add data/kei_annual_history.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh official historical kei annual registrations"
          git pull --rebase origin main
          git push origin HEAD:main